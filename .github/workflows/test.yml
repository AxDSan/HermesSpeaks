name: Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [18.x, 20.x]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Run slop removal tests
      run: node tests/slop-removal.test.js
    
    - name: Run heuristic detection tests
      run: node tests/heuristic.test.js
    
    - name: Test CLI
      run: |
        node hermes-speaks.js "It is important to note that we leverage AI."
        node hermes-speaks.js --detect "Test text"
